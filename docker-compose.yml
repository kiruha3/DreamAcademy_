version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=mysql://academy:academy_pass@db:3306/dreamdocs_academy
      - APP_ID=dreamdocs-academy
      - APP_SECRET=${APP_SECRET}
      - OWNER_UNION_ID=${OWNER_UNION_ID}
      - S3_REGION=${S3_REGION}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_BUCKET=${S3_BUCKET}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL}
    depends_on:
      - db
    volumes:
      - uploads:/app/public/uploads
      - content:/app/public/content

  db:
    image: mysql:8
    environment:
      - MYSQL_ROOT_PASSWORD=root_pass
      - MYSQL_DATABASE=dreamdocs_academy
      - MYSQL_USER=academy
      - MYSQL_PASSWORD=academy_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
  uploads:
  content:
